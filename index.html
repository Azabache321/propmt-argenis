const floors=[['06','AI workspace','AI application concepts and workspace interfaces.'],['05','Web interfaces','Website and web interface work.'],['04','Engineering visualization','Systems and technical visualization work.'],['03','Systems & security','Project Masada, a security monitoring application project.'],['02','Applications & documents','ExSolve, a financial workspace project. SDF Folio, a PDF and document workspace project.'],['01','Digital experiences','Mobile and digital interface work.']];
function open(){if(!dialog.open)dialog.showModal()}
function paragraph(text,cls=''){const p=document.createElement('p');p.textContent=text;p.className=cls;content.append(p);return p}
function floor(n){const f=floors.find(f=>f[0]===n);label.textContent='FLOOR '+f[0]+' / THE GALLERIA';heading.textContent=f[1];content.replaceChildren();paragraph(f[2]);paragraph('Case study details, approved screenshots, and release links are pending. Showcase screens are illustrative.','status');const back=document.createElement('button');back.className='panel-action';back.textContent='← All floors';back.onclick=()=>panel('work');content.append(back);open()}
function panel(kind){content.replaceChildren();label.textContent='THE GALLERIA';if(kind==='work'){heading.textContent='Choose your floor.';paragraph('Each showcase opens here, within the gallery.');const list=document.createElement('div');list.className='floor-list';for(const f of floors){const b=document.createElement('button');const number=document.createElement('span');number.textContent=f[0];b.append(number,document.createTextNode(f[1]));b.onclick=()=>floor(f[0]);list.append(b)}content.append(list)}else if(kind==='about'){heading.textContent='Engineering with intent.';paragraph('Bobby Argenis, Application & Systems Engineer.');paragraph('My work brings applications, websites, interfaces, and systems together. This gallery presents those disciplines in one place.')}else{heading.textContent='Start a conversation.';paragraph('Public contact details are pending review.');paragraph('Add your approved email address or contact link to this panel before release.','status')}open()}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>panel(b.dataset.panel));document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>floor(b.dataset.floor));document.querySelector('#close').onclick=()=>dialog.close();
